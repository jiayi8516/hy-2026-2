<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>YOUR ROUTE, YOUR CHOICE</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#231f20;--mut:#777;--card:#f5f2f0;--pk:#e5006a;--fa:#dd5265;--ea:#3fb27f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--fg:#f3f0ee;--mut:#a09b97;--card:#232120}}
:root[data-theme="dark"]{--bg:#151515;--fg:#f3f0ee;--mut:#a09b97;--card:#232120}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 'Noto Sans KR',sans-serif}
.app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
aside{padding:28px 24px;overflow:auto;max-height:100vh}
h1{font:900 30px/1.05 'Noto Sans KR',sans-serif;letter-spacing:-.5px;margin:0}
.sub{color:var(--pk);font-weight:700;font-size:18px;margin:8px 0 2px}.mut{color:var(--mut);font-size:12px}
h2{font-size:11px;letter-spacing:.12em;margin:22px 0 8px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border:1.5px solid var(--fg);background:none;color:var(--fg);border-radius:999px;padding:5px 11px}
button.on{background:var(--fg);color:var(--bg)}
.mode{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.mode button{border-radius:8px;border:0;color:#fff;font-weight:700;opacity:.45;padding:10px}
.mode button.on{opacity:1;background:inherit;color:#fff}
.row{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.row.sel{border-color:var(--pk)}.row b{font:400 18px 'Black Han Sans',sans-serif;color:var(--pk)}
.cs{display:flex;gap:8px;margin-top:6px}.c{flex:1;border-radius:7px;padding:6px 8px;font-size:11px;border:1.5px solid}
.c.f{border-color:var(--fa)}.c.e{border-color:var(--ea)}.c i{font:normal 700 16px 'Noto Sans KR';display:block}.c.f i{color:var(--fa)}.c.e i{color:var(--ea)}
main{padding:12px;display:flex;align-items:center}svg{width:100%;height:auto;max-height:96vh}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{max-height:none}}
</style></head><body><div class="app"><aside>
<h1>YOUR ROUTE,<br>YOUR CHOICE</h1><div class="sub">나에게 맞는 이동 경로</div><div class="mut">같은 목적지라도, 나에게 맞는 길은 다릅니다.</div>
<h2>출발역 · ORIGIN</h2><div class="chips" id="org"></div>
<h2>ROUTE TYPE</h2><div class="mode" id="mode"></div>
<h2>목적지 · DESTINATIONS <span class="mut">(탭하여 선택)</span></h2><div id="list"></div>
<h2>노선</h2><div class="lg" id="lg"></div>
<p class="mut" style="margin-top:18px">경로는 노선 그래프 위에서 계산됩니다. FAST = 시간 최소, EASY = 환승·도보 부담까지 반영. 시간·도보 값은 프로토타입용 가정치입니다.</p>
</aside><main><svg id="map" viewBox="3500 450 5000 3950"></svg></main></div>
<script>
const P=`한대앞 6933 4047 009BCE;한강진 5265 2218 713A1D;성수 5605 1563 00A23F;서울숲 6374 1752 ECA300;신사 5999 2355 EB6100;강남 6801 2409 00A23F;올림픽공원 6744 1283 A49D87;명동 4965 2718 009BCE;동대문 4468 2028 009BCE;홍대입구 4786 3220 00A23F;성신여대입구 4681 1534 86BFE0;종로3가 3737 2242 9BA2BF;창동 4898 1108 86BFE0;신설동 5380 831 A8D4A2;신당 5195 1160 A8D4A2;김포공항 3952 3469 C6B3D6;양천구청 4873 3817 B1D8AB;중앙보훈병원 6742 715 DEDAD1;가락시장 7227 1686 F2BD92;방이 6992 1509 C0AAD1;마천 7495 1400 C0AAD1;어정 8058 3131 C0D59C;청계산입구 7543 2538 E3AB98;북한산우이 4471 822 EDF1D0;건대입구 6019 1615 9FA0A0;도곡 7290 2177 9FA0A0;선릉 6940 2015 9FA0A0;삼각지 5274 2824 9FA0A0;동작 5690 2959 9FA0A0;교대 6742 2721 9FA0A0;총신대입구 6080 3074 9FA0A0;사당 6577 3282 9FA0A0`;
const st={};P.split(';').forEach(r=>{const[a,x,y,c]=r.split(' ');st[a]={x:+x,y:+y,c:'#'+c}});
const MAIN=['한대앞','홍대입구','성수','강남','신사','서울숲','올림픽공원','동대문','명동','한강진'];
const SPUR=`C6B3D6:3936,3465 4393,3598 4950,3318|B1D8AB:4656,3479 4871,3794|F8C194:7272,2187 7224,1654|C0AAD1:7008,1535 7215,1681 7530,1387|E3AB98:7090,2626 7255,2662 7529,2547|C6DC9F:7440,3287 8041,3135|DDD9D0:6765,1264 6738,692|86BFE0:4460,1975 4887,1136|9EA6C4:4405,2062 3746,2244|A8D4A2:5602,1540 5755,1220 5395,854|A8D4A2:5589,1531 5189,1149|F1F4D3:4674,1515 4475,841`;
const LN=[['4호선','#009BCE',['동대문 6 명동 7 삼각지 5 동작 4 총신대입구 4 사당 44 한대앞']],
['2호선','#00A23F',['홍대입구 28 사당 24 건대입구 5 성수','사당 4 교대 5 강남 3 선릉']],
['3호선','#EB6100',['신사 18 교대 8 도곡']],['7호선','#6B6E2E',['건대입구 20 총신대입구']],
['9호선','#A49D87',['올림픽공원 15 신사 10 동작']],['수인분당선','#ECA300',['한대앞 89 도곡 3 선릉 15 서울숲']],
['6호선','#713A1D',['한강진 10 삼각지']],['1호선','#004B87',['홍대입구 78 한대앞']]];
const WP={'홍대입구-한대앞':[[5440,3790],[6096,4057],[6476,3988]],'한대앞-도곡':[[8119,1937],[7563,1652]],'교대-도곡':[[6955,2836]]};
const WK={사당:155,삼각지:74,총신대입구:216,동작:164,교대:245,신사:292,건대입구:353,선릉:155,도곡:155};
const E=[],at={};
LN.forEach(([ln,c,chs])=>chs.forEach(ch=>{const t=ch.split(' ');for(let i=0;i<t.length-2;i+=2)E.push({a:t[i],b:t[i+2],m:+t[i+1],l:ln,c});}));
E.forEach(e=>[e.a,e.b].forEach(s=>(at[s]=at[s]||new Set()).add(e.l)));
const adj={};E.forEach(e=>{(adj[e.a+'|'+e.l]=adj[e.a+'|'+e.l]||[]).push([e.b,e.m,e]);(adj[e.b+'|'+e.l]=adj[e.b+'|'+e.l]||[]).push([e.a,e.m,e])});
function geo(e,from){const f=e.a+'-'+e.b,r=e.b+'-'+e.a;let w=WP[f]||(WP[r]?[...WP[r]].reverse():[]);if(from===e.b&&WP[f])w=[...w].reverse();if(from===e.a&&!WP[f]&&WP[r])w=[...WP[r]].reverse();return w}
function route(o,d,mode){
 const W=(m,x,w)=>mode=='fast'?m+x*3:m+x*14+w/18,dist={},prev={},done=new Set();
 at[o].forEach(l=>dist[o+'|'+l]=0);let end=null;
 for(;;){let u=null;for(const k in dist)if(!done.has(k)&&(u==null||dist[k]<dist[u]))u=k;if(u==null)break;done.add(u);
  const[s,l]=u.split('|');if(s==d){end=u;break}
  const rel=(k,c,p)=>{if(dist[k]==null||dist[u]+c<dist[k]){dist[k]=dist[u]+c;prev[k]={u,...p}}};
  (adj[u]||[]).forEach(([n,m,e])=>rel(n+'|'+l,W(m,0,0),{m,x:0,w:0,e,from:s}));
  at[s].forEach(l2=>{if(l2!=l){const w=WK[s]||100;rel(s+'|'+l2,W(5,1,w),{m:5,x:1,w})}})}
 if(!end)return null;let m=0,x=0,w=0,seg=[],k=end;
 while(prev[k]){const p=prev[k];m+=p.m;x+=p.x;w+=p.w;seg.unshift({k,p});k=p.u}
 const pts=[[st[o].x,st[o].y]];seg.forEach(({k,p})=>{if(p.e){geo(p.e,p.from).forEach(q=>pts.push(q));const s=k.split('|')[0];pts.push([st[s].x,st[s].y])}});
 return{m,x,w,pts}}
const fmt=m=>(m>=60?Math.floor(m/60)+'h ':'')+(m%60?m%60+'min':'');
let org='한대앞',mode='all',sel=null;
const $=s=>document.getElementById(s);
function draw(){
 const rs={};MAIN.filter(n=>n!=org).forEach(d=>rs[d]={fast:route(org,d,'fast'),easy:route(org,d,'easy')});
 let h='<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter><filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter></defs>';
 SPUR.split('|').forEach(s=>{const[c,p]=s.split(':');h+=`<polyline fill="none" stroke="#${c}" stroke-width="30" points="${p}"/>`});
 E.forEach(e=>{const A=st[e.a],B=st[e.b],w=[...(WP[e.a+'-'+e.b]||(WP[e.b+'-'+e.a]||[]).slice().reverse())];
  h+=`<polyline fill="none" stroke="${e.c}" stroke-width="110" stroke-linecap="round" stroke-linejoin="round" points="${[[A.x,A.y],...w,[B.x,B.y]].join(' ')}"/>`});
 ['easy','fast'].forEach(md=>{if(mode!='all'&&mode!=md)return;for(const d in rs){const r=rs[d][md];if(!r)continue;const op=sel&&sel!=d?.1:.9;
  h+=md=='easy'?`<g opacity="${op}" fill="none" stroke-linejoin="round" stroke-linecap="round"><polyline stroke="#39ff9a" stroke-width="120" opacity=".55" filter="url(#glow)" points="${r.pts.join(' ')}"/><polyline stroke="#39ff9a" stroke-width="70" opacity=".8" filter="url(#glow2)" points="${r.pts.join(' ')}"/><polyline stroke="#12d46f" stroke-width="44" points="${r.pts.join(' ')}"/><polyline stroke="#eafff3" stroke-width="12" points="${r.pts.join(' ')}"/></g>`
  :`<polyline fill="none" stroke="#dd5265" stroke-width="14" stroke-dasharray="50 44" opacity="${op}" stroke-linejoin="round" points="${r.pts.join(' ')}"/>`}});
 for(const n in st){const s=st[n],main=MAIN.includes(n);if(main)continue;
  h+=`<circle cx="${s.x}" cy="${s.y}" r="38" fill="#fff" stroke="${s.c}" stroke-width="20"/><text x="${s.x+55}" y="${s.y-40}" font-size="46" fill="#999" font-family="Noto Sans KR">${n}</text>`}
 MAIN.forEach(n=>{const s=st[n],o=n==org,col=o?'#231f20':'#e5006a',dim=sel&&sel!=n&&!o?.35:1;
  h+=`<g opacity="${dim}" style="cursor:pointer" data-d="${n}"><circle cx="${s.x}" cy="${s.y}" r="78" fill="#fff" stroke="${s.c}" stroke-width="24"/>
  <path transform="translate(${s.x},${s.y})" d="M0 -40C-90 -170-130 -210-130 -290A130 130 0 1 1 130 -290C130 -210 90 -170 0 -40Z" fill="${col}"/><circle cx="${s.x}" cy="${s.y-330}" r="48" fill="#fff"/>
  <text x="${s.x+115}" y="${s.y+50}" font-size="130" fill="${col}" font-family="Black Han Sans" stroke="#fff" stroke-width="10" paint-order="stroke">${n}</text></g>`});
 $('map').innerHTML=h;
 $('list').innerHTML=Object.keys(rs).map(d=>{const c=(r,t)=>r?`<div class="c ${t[0]}">${t.toUpperCase()}<i>${fmt(r.m)}</i>${r.w}m 도보 · 환승 ${r.x}<br>${r.x>=2||r.w>250?'High':'Low'} Effort</div>`:'';
  return `<div class="row${sel==d?' sel':''}" data-d="${d}"><b>${d}</b><div class="cs">${mode!='easy'?c(rs[d].fast,'fast'):''}${mode!='fast'?c(rs[d].easy,'easy'):''}</div></div>`}).join('')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-d]');if(t){sel=sel==t.dataset.d?null:t.dataset.d;draw()}});
function ui(){$('org').innerHTML=MAIN.map(n=>`<button class="${n==org?'on':''}" data-o="${n}">${n}</button>`).join('');
 $('mode').innerHTML=[['all','BOTH','#231f20'],['fast','FAST','#dd5265'],['easy','EASY','#3fb27f']].map(([k,t,c])=>`<button class="${k==mode?'on':''}" style="background:${c}" data-m="${k}">${t}</button>`).join('')}
document.addEventListener('click',e=>{const o=e.target.dataset.o,m=e.target.dataset.m;if(o){org=o;sel=null}if(m)mode=m;if(o||m){ui();draw()}});
$('lg').innerHTML=LN.map(l=>`<span style="--c:${l[1]}">${l[0]}</span>`).join('');
ui();draw();
</script></body></html>
